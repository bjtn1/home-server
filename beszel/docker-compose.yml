services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    # healthcheck:
    #   test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
    #   interval: 120s
    #   start_period: 10s
    #   timeout: 5s
    networks:
      - bjtn-proxy

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Per-drive usage charts: the agent reports disk usage for anything
      # mounted under /extra-filesystems/<name>__<Label>. <name> is
      # deliberately not a device, so the agent finds the drive by mount
      # (the vault's sdX letter moves); <Label> is what the UI shows.
      # An empty .beszel dir on
      # each drive is enough (usage is per-filesystem) and keeps the
      # agent from seeing any actual files.
      - /mnt/vault/.beszel:/extra-filesystems/vault__Vault:ro
      - /mnt/b1_4tb/.beszel:/extra-filesystems/micron__Micron 4TB:ro
      - /mnt/b2_4tb/.beszel:/extra-filesystems/t9__T9 4TB:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDoo8A/nUkllQgudh73PshGVkVPC2OI7R25p+WqS5zB7'
      TOKEN: ${TOKEN}
    # healthcheck:
    #   test: ['CMD', '/agent', 'health']
    #   interval: 120s
networks:
  bjtn-proxy:
    external: true
