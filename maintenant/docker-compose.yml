# Docker/host monitoring: containers, endpoints, cron jobs, SSL certs, image
# updates, all auto-discovered. https://github.com/kolapsis/maintenant
services:
  maintenant:
    image: ghcr.io/kolapsis/maintenant:latest
    container_name: maintenant
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - ./data:/data
    environment:
      - MAINTENANT_ADDR=0.0.0.0:8080
      - MAINTENANT_DB=/data/maintenant.db
      - TZ=America/New_York
    #ports:
      #- 8080:8080
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
