# Your Own URL Shortener. https://yourls.org
services:
  yourls:
    image: yourls:latest
    container_name: yourls
    restart: unless-stopped
    depends_on:
      - yourls-db
    environment:
      - YOURLS_DB_HOST=yourls-db
      - YOURLS_DB_USER=yourls
      - YOURLS_DB_PASS=${YOURLS_DB_PASSWORD}
      - YOURLS_DB_NAME=yourls
      - YOURLS_SITE=https://yourls.bjtn.xyz
      - YOURLS_USER=${YOURLS_ADMIN_USER}
      - YOURLS_PASS=${YOURLS_ADMIN_PASSWORD}
    volumes:
      # Sleeky's admin dark-mode theme (https://github.com/Flynntes/Sleeky).
      # ./plugins/ isn't tracked in git (this repo doesn't vendor third-party
      # app code) -- to restore it on a fresh clone:
      #   git clone --depth 1 https://github.com/Flynntes/Sleeky /tmp/sleeky
      #   mkdir -p plugins && cp -r /tmp/sleeky/sleeky-backend plugins/
      # Then activate once at Admin > Manage Plugins > "Sleeky Backend".
      - ./plugins/sleeky-backend:/var/www/html/user/plugins/sleeky-backend
    networks:
      - bjtn-proxy

  yourls-db:
    image: mariadb:latest
    container_name: yourls-db
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=yourls
      - MARIADB_USER=yourls
      - MARIADB_PASSWORD=${YOURLS_DB_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${YOURLS_DB_ROOT_PASSWORD}
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
