# Config for disk-io-watchdog.service
# Fill in KUMA_PUSH_URL once you've created a "Push" monitor in Kuma:
#   Kuma UI -> + Add New Monitor -> Monitor Type: Push -> save it.
# Kuma gives you a URL like: https://kuma.bjtn.xyz/api/push/<token>
# Paste that exact URL below (no query string needed, the script adds one).
KUMA_PUSH_URL="https://kuma.bjtn.xyz/api/push/eTfYq706Me"

# How many "I/O error, dev sdX" kernel log lines within WINDOW_SECONDS
# count as a real incident (not a single transient blip).
ERROR_THRESHOLD=5
WINDOW_SECONDS=30

# Don't re-alert more than once per COOLDOWN_SECONDS for an ongoing/recurring
# incident -- but the container-stop action still re-runs every trigger
# regardless of cooldown, since that's idempotent and safe.
COOLDOWN_SECONDS=1800

# Containers stopped when an incident triggers -- same list used manually
# tonight, twice, successfully. Broad on purpose: safety script, so erring
# toward stopping more than strictly necessary beats leaving a writer active.
WRITERS="sabnzbd sonarr radarr unpackerr qbittorrent bazarr shelfmark jdownloader2"

# Mountpoints WRITERS actually depend on. The script resolves these to their
# current underlying kernel device name (sdX) via /etc/fstab's UUID -> blkid,
# fresh on every check -- NOT a hardcoded device letter, since USB
# reconnects/hub resets can and do reassign sdX letters (confirmed
# 2026-08-23/2026-09-01). An I/O error on a device outside this set (e.g.
# one of the backup SSDs, which the writers don't touch) is logged but does
# NOT stop anything -- added 2026-09-02 after confirming every I/O error
# during the 2026-09-01 incident was actually on an unrelated backup drive,
# yet the old any-sdX-letter match stopped the writers anyway.
WATCHED_MOUNTPOINTS="/mnt/vault /mnt/games"
