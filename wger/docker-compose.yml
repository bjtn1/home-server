# Self-hosted workout/fitness/nutrition tracker. https://github.com/wger-project/docker
#
# Simplified from upstream's compose (dropped PowerSync -- that's only for
# offline-first mobile sync, not needed for a normal browser-based setup).
services:
  wger-db:
    image: postgres:15-alpine
    container_name: wger-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/New_York
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bjtn-proxy

  wger-cache:
    image: redis:latest
    container_name: wger-cache
    restart: unless-stopped
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bjtn-proxy

  wger-web:
    image: wger/server:latest
    container_name: wger-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      wger-db:
        condition: service_healthy
      wger-cache:
        condition: service_healthy
    volumes:
      - ./data/static:/home/wger/static
      - ./data/media:/home/wger/media
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - bjtn-proxy

  wger-celery-worker:
    image: wger/server:latest
    container_name: wger-celery-worker
    restart: unless-stopped
    command: /start-worker
    env_file:
      - .env
    depends_on:
      wger-web:
        condition: service_healthy
    volumes:
      - ./data/static:/home/wger/static
      - ./data/media:/home/wger/media
    networks:
      - bjtn-proxy

  wger-celery-beat:
    image: wger/server:latest
    container_name: wger-celery-beat
    restart: unless-stopped
    command: /start-beat
    env_file:
      - .env
    depends_on:
      - wger-celery-worker
    volumes:
      - ./data/static:/home/wger/static
      - ./data/media:/home/wger/media
    networks:
      - bjtn-proxy

  wger-nginx:
    image: nginx:stable
    container_name: wger-nginx
    restart: unless-stopped
    depends_on:
      wger-web:
        condition: service_healthy
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/static:/wger/static:ro
      - ./data/media:/wger/media:ro
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
