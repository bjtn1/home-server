# JDownloader2 -- link-decrypting/one-click-hoster download manager with a
# real per-file/per-package destination folder (unlike pyload). Web-based
# noVNC GUI, so you interact with the actual JDownloader desktop app in a
# browser. https://github.com/jlesage/docker-jdownloader-2
services:
  jdownloader2:
    image: jlesage/jdownloader-2
    container_name: jdownloader2
    restart: unless-stopped
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=America/New_York
    volumes:
      - ./config:/config
      - ${JDOWNLOADER_DOWNLOADS_PATH}:/output
      - ${JDOWNLOADER_MEDIA_PATH}:/mnt/media
      - ${JDOWNLOADER_OBS_PATH}:/mnt/obs
      - ${JDOWNLOADER_EMU_PATH}:/mnt/emu
      - ${JDOWNLOADER_GAMES_PATH}:/mnt/games
      - ${JDOWNLOADER_OTHER_PATH}:/mnt/other
      - ${JDOWNLOADER_BEIGE_PATH}:/mnt/beige
    #ports:
      #- 5800:5800 # web GUI
      #- 5900:5900 # raw VNC, optional
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
