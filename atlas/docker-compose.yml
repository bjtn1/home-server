# Network discovery/visualization/monitoring. https://github.com/karam-ajaj/atlas
#
# Upstream only documents `docker run`, no compose file. network_mode: host
# is required for raw ARP/ping scanning (same pattern as ../upsnap), so this
# isn't on bjtn-proxy -- reach it via the host's LAN IP in Caddy instead.
services:
  atlas:
    image: keinstien/atlas:latest
    container_name: atlas
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ATLAS_UI_PORT=8888
      - ATLAS_API_PORT=8889
      - ATLAS_ADMIN_USER=admin
      - ATLAS_ADMIN_PASSWORD=${ATLAS_ADMIN_PASSWORD}
      - ATLAS_AUTH_TTL_SECONDS=86400
      - SCAN_SUBNETS=192.168.1.0/24
