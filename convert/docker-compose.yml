# convert.to.it -- universal file converter, runs client-side (no uploads).
# https://github.com/p2r3/convert
services:
  convert:
    image: ghcr.io/p2r3/convert:latest
    container_name: convert
    restart: unless-stopped
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
