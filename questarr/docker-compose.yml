# *Arr-inspired game manager/downloader (PC + console releases, not ROMs --
# see romarr for that). https://github.com/Doezer/Questarr
services:
  questarr:
    image: ghcr.io/doezer/questarr:latest
    container_name: questarr
    restart: unless-stopped
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
    volumes:
      - ./data:/app/data
      # root games dir -- same one romm's library lives under -- so an
      # eventual atomic move from a downloads subfolder to a library
      # subfolder doesn't cross filesystems.
      - ${GAMES_DIR}:/data/games
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
