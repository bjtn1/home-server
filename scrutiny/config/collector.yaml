version: 1
host:
  id: ""

# Letters here are the container-internal targets pinned by the
# `devices:` by-id mapping in docker-compose.yml, so they stay stable
# no matter what the host currently calls each drive. Keep the two in
# sync if a drive is added/replaced.
#
# The internal SATA SSD (/dev/sda) auto-detects fine and needs no entry.
# Each type below confirmed via `docker exec scrutiny-collector
# smartctl --info -d <type> /dev/sdX` (exit 0, correct model/serial)
# 2026-10-05.
devices:
  # 12TB vault, ST12000VN0008-3MH101, serial ZZ30PC97. Auto-detect
  # guesses NVMe first and fails ("Read NVMe Identify Controller
  # failed"), so force 'sat'.
  - device: /dev/sdb
    type: 'sat'
  # Micron CT4000X9SSD9 (serial 2535EA97271A) and Samsung PSSD T9
  # (serial S744NL0Y809472T): USB-NVMe bridges not in smartmontools'
  # known-bridge database, so auto-detect skips/misdetects them.
  - device: /dev/sdc
    type: 'sntasmedia'
  - device: /dev/sdd
    type: 'sntasmedia'
