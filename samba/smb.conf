[global]
    server string = samba
    idmap config * : range = 3000-7999
    security = user
    server min protocol = SMB2

    # disable printing services
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    host msdfs = no
    wide links = yes
    follow symlinks = yes
    unix extensions = no
    acl allow execute always = yes

    # MacOS Compatibility options
    #
    # No vfs_fruit, no ea support, no streams_xattr -- all deliberately
    # stripped out. vfs_fruit's two metadata modes both failed writing to
    # these exFAT-backed shares (stream needs real xattrs, which exFAT has
    # none of; netatalk's AppleDouble sidecar writes failed too, for
    # reasons specific to smbd's write path here, not exFAT itself -- a
    # direct sparse pwrite() test on the same mount worked fine outside
    # Samba). Then macOS Finder hit a *separate*, well-documented Finder
    # bug (error 100093 / kPOSIXErrorENOATTR, Ventura/Sonoma) querying an
    # xattr that doesn't exist and treating "doesn't exist" as fatal.
    # Advertising zero xattr/EA capability at all is the next thing to try
    # against that -- not guaranteed, since it's a client-side Apple bug,
    # but it removes another thing that could be triggering the query.
    # Real fallback if this still doesn't work: use Terminal `mv`/`cp`
    # against the mounted share instead of Finder -- bypasses Finder's
    # xattr-preservation logic entirely.
    ea support = no
    vfs objects = catia fruit

    # fruit:aapl enables the Apple (AAPL) SMB2 protocol extension, which is
    # negotiated at connection time -- before any specific share is picked
    # -- so it has to live in [global], not under [apple-backups]. This is
    # almost certainly why apple-backups wasn't showing up as a Time
    # Machine option even after manually connecting to it: without this,
    # macOS never sees the server as Apple-extension-capable at all.
    # Loading the fruit module here does NOT turn on its metadata/xattr
    # behavior for [mnt] -- [mnt] explicitly redeclares a fruit-free
    # `vfs objects` below, which overrides (not appends to) this global
    # list for that share, so the original exFAT-related fix stays intact.
    fruit:aapl = yes

    # fix filenames with special chars (should be default)
    mangled names = no
    dos charset = CP850
    unix charset = UTF-8

[mnt]
    path = /storage
    comment = Shared
    browseable = yes
    writable = yes
    read only = no

    # explicit override, fruit-free -- see the [global] comment above.
    # Keeps this share on the exFAT-safe path even though fruit is now
    # loaded globally for apple-backups' sake.
    vfs objects = catia

   force user = bjtn
   force group = smb

[vault]
    # Dedicated share straight at the real /mnt/vault volume (26T, not the
    # ~220G host root partition [mnt] itself technically lives on before
    # you're inside its vault\ subfolder). Added 2026-09-11 after a real
    # Windows copy into Z:\vault\... was refused for "not enough space" --
    # Explorer's free-space check was reading root-partition space (~151G)
    # for a client connected at the [mnt] share's own root, not the actual
    # destination volume. A share rooted directly at /storage/vault removes
    # that ambiguity entirely: every path under this share is guaranteed to
    # be on the 26T volume, so free-space queries can't land on the wrong
    # filesystem no matter what folder depth you're browsing at.
    path = /storage/vault
    comment = Vault (26T volume)
    browseable = yes
    writable = yes
    read only = no
    vfs objects = catia

    force user = bjtn
    force group = smb

# Same pattern as [vault] above, applied to every other real mount point
# under /mnt -- each one rooted directly at its own mount, not at /mnt
# itself, so free-space queries can never land on the host root partition
# no matter what folder depth you're browsing at. Added 2026-09-11.
# (/mnt/vault/books is a bind mount NESTED inside vault, not a separate
# top-level mount -- already covered by [vault], no share of its own.)

[games]
    path = /storage/games
    comment = Games (11T volume)
    browseable = yes
    writable = yes
    read only = no
    vfs objects = catia

    force user = bjtn
    force group = smb

[b1_4tb]
    path = /storage/b1_4tb
    comment = b1_4tb (3.7T exFAT drive)
    browseable = yes
    writable = yes
    read only = no
    vfs objects = catia

    force user = bjtn
    force group = smb

[b2_4tb]
    path = /storage/b2_4tb
    comment = b2_4tb (3.7T exFAT drive)
    browseable = yes
    writable = yes
    read only = no
    vfs objects = catia

    force user = bjtn
    force group = smb

[apple-backups]
    # Dedicated Time Machine target for MacBook (+ iPhone backups, which
    # Finder stores locally in ~/Library/Application Support/MobileSync/Backup
    # on the Mac itself -- those get swept in automatically once Time
    # Machine is backing up the whole Mac, no separate iPhone config needed).
    #
    # Unlike [mnt] above, vfs_fruit is enabled here on purpose: the earlier
    # attempt (see the big comment under [global]) failed specifically
    # because the old shares were backed by exFAT, which has no real
    # extended attribute support -- vfs_fruit's xattr-backed metadata mode
    # needs real xattrs to work. This share lives on /mnt/vault, which is
    # ext4 (real xattr support), so the original blocker doesn't apply here.
    path = /storage/vault/apple-backups
    comment = Time Machine
    browseable = yes
    writable = yes
    read only = no
    ea support = yes
    vfs objects = fruit streams_xattr
    fruit:aapl = yes
    fruit:time machine = yes
    fruit:time machine max size = 1T

    force user = bjtn
    force group = smb
