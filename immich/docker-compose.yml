#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich-server:
    container_name: immich
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # ThinkPad's UHD 620 (Gen9.5) does real hardware transcode via VAAPI --
    # verified working during migration testing (7x realtime, ~5% CPU).
    # Not "quicksync": Debian's ffmpeg ships without libmfx and the newer
    # oneVPL runtime only supports Gen12+, so vaapi is the correct backend
    # here even though this is Quick Sync hardware.
    extends:
      file: hwaccel.transcoding.yml
      service: vaapi
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      # Existing deduplicated family photo/video collection, added as an
      # External Library (Administration -> External Libraries in the
      # Immich UI) rather than the upload location -- these files stay
      # organized as-is, Immich just indexes/thumbnails them in place.
      # Mounted read-write (not :ro) so that emptying Immich's trash can
      # actually unlink the underlying file for these assets too -- with
      # :ro, Immich's delete job still runs but silently fails the unlink
      # (EROFS, caught and only logged as a WARN in
      # StorageService.handleDeleteFiles), so the DB row disappears while
      # the file stays on disk and reappears on the next library scan.
      # Tradeoff: Immich can now permanently delete real vault files, not
      # just its own index, on trash-empty (still gated by the 30-day
      # trash window for anything not force-deleted).
      - /mnt/vault/immich:/mnt/vault-immich
      # OBS screen/gameplay recordings (314GB) -- previously "referenced"
      # by a Jellyfin library pointing at a since-removed /obs mount that
      # no longer exists anywhere on this host, so nothing was actually
      # served. Added here as a second External Library instead. NOT
      # currently covered by any restic backup (unlike vault-immich above,
      # which immich-backup does cover) -- backup capacity for this one
      # is still an open question as of 2026-09-02, deliberately deferred.
      - /mnt/vault/obs:/mnt/vault-obs
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    networks:
      - bjtn-proxy
      - default

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    # Tailscale rewrites the host's /etc/resolv.conf to its MagicDNS resolver
    # (100.100.100.100), which only resolves from the host's own network
    # namespace -- Docker's per-container embedded DNS (127.0.0.11) can't
    # reach it from inside a bridge network, so any container doing runtime
    # hostname lookups gets SERVFAIL/name-resolution failures (confirmed
    # host-wide 2026-08-31, not immich-specific). Scoped fix here since this
    # is the fallback ML backend and needs to actually download its model.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:

networks:
  bjtn-proxy:
    external: true
