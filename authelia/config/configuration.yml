# Authelia main config -- deliberately holds NO secrets (those come from env vars set in
# docker-compose.yml, sourced from the untracked .env -- see .env.example for the list).
# access_control lives in a SEPARATE file (access.yml, generated by ../access-control) so
# that app only ever needs write access to one small, low-stakes file, never this one.
#
# Single-instance, no Redis, no Postgres: sessions are in-memory (lost on an authelia
# restart, meaning a re-login is needed -- an accepted tradeoff for a homelab with a
# handful of users) and storage is a local SQLite file. No SMTP server exists for this
# purpose, so password-reset/identity-verification messages go to a local file
# (notifier.filesystem) instead of real email; bjtn can `docker exec authelia cat
# /config/notification.txt` to read one, or just ask for a fresh password hash directly.

theme: dark

server:
  address: 'tcp://:9091'

log:
  level: info

totp:
  issuer: bjtn.xyz

authentication_backend:
  # password reset stays at its default (enabled) here -- no line needed, and an explicit
  # "disable: false" under this key name trips gitleaks' hardcoded-password-value rule as a
  # false positive (it's a boolean, not a secret; confirmed by its own 2.8-bit entropy score).
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

session:
  name: authelia_session
  same_site: lax
  expiration: 12h
  inactivity: 1h
  remember_me: 1M
  cookies:
    - domain: bjtn.xyz
      authelia_url: https://auth.bjtn.xyz
      default_redirection_url: https://homarr.bjtn.xyz/

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 15m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt
