# Getting Things Done (GTD) app, PWA + self-hosted sync server.
# https://github.com/dongdongbh/Mindwtr
services:
  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:latest
    container_name: mindwtr-cloud
    hostname: mindwtr-cloud
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/health >/dev/null || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - MINDWTR_CLOUD_AUTH_TOKENS=${MINDWTR_CLOUD_AUTH_TOKENS}
      - MINDWTR_CLOUD_CORS_ORIGIN=https://mindwtr.bjtn.xyz
    volumes:
      - ./data:/app/cloud_data
    networks:
      - bjtn-proxy

  mindwtr-app:
    image: ghcr.io/dongdongbh/mindwtr-app:latest
    container_name: mindwtr-app
    hostname: mindwtr-app
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    depends_on:
      mindwtr-cloud:
        condition: service_healthy
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
