services:
  caddy:
    build: .
    container_name: caddy
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      bjtn-proxy:
        # Pinned so other containers can reach Caddy at a stable address --
        # see the extra_hosts comment in kuma/docker-compose.yml for why.
        ipv4_address: 172.20.0.2
    restart: unless-stopped
    extra_hosts:
       - "host.docker.internal:host-gateway"

networks:
  bjtn-proxy:
    external: true

