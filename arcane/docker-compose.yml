# Self-hosted Docker management UI (Portainer alternative).
# https://github.com/getarcaneapp/arcane
services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    restart: unless-stopped
    # Host cgroup namespace so Arcane can reliably detect its own container
    # ID -- needed for self-upgrades.
    cgroup: host
    environment:
      - APP_URL=https://arcane.bjtn.xyz
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=${ARCANE_ENCRYPTION_KEY}
      - JWT_SECRET=${ARCANE_JWT_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Read access to every compose project's files -- Arcane's project-based
      # updater resolves relative volume paths (e.g. ./data) against the
      # compose file's location, and since it drives docker via the host's
      # daemon (over docker.sock), that resolved path has to be valid on the
      # HOST, not just inside this container. So the mount path must match
      # the host path exactly (/home/bjtn/docker on both sides) -- remapping
      # it (e.g. to /app/data/projects) would make Arcane compute host paths
      # that don't exist. Read-only: doesn't meaningfully change Arcane's
      # blast radius since docker.sock already grants root-equivalent host
      # access, but there's no reason for it to write here.
      - /home/bjtn/docker:/home/bjtn/docker:ro
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
