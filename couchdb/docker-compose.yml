# CouchDB sync backend for Obsidian LiveSync (community plugin) --
# https://github.com/vrtmrz/obsidian-livesync. Obsidian itself runs on your
# own devices (desktop/mobile); this container is purely the sync server
# between them. Single-node mode, initialized via couchdb-init.sh (run once
# after first boot -- see that script for exactly what it configures and why).
services:
  couchdb:
    image: couchdb:3
    container_name: couchdb
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ./data:/opt/couchdb/data
      - ./etc-local.d:/opt/couchdb/etc/local.d
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
