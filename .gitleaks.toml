[extend]
useDefault = true

# Default gitleaks rules mostly key off entropy, which misses short,
# dictionary-like passwords assigned to *password*-style keys (e.g.
# FTLCONF_webserver_api_password: 'hunter2'). This rule flags any
# non-empty, non-variable-reference value assigned to such a key,
# regardless of entropy.
[[rules]]
id = "hardcoded-password-value"
description = "Hardcoded value assigned to a password-like variable"
regex = '''(?i)pass(?:wd|word)?[\w.-]{0,20}[\s'"]{0,3}(?:=|:|=>)[\s'"]{0,5}([^\s'"$<][\w!@#$%^&*()+=./-]{4,100})'''
keywords = ["passwd", "password", "pass"]

[allowlist]
regexes = [
  # SSH public keys are meant to be shared, not secret.
  '''ssh-(ed25519|rsa) [A-Za-z0-9+/]+={0,3}''',
  # hardcoded-password-value's own "non-variable-reference" intent (see its
  # comment above) only excludes shell-style $VAR/<VAR>, not two common
  # Python shapes: a bare ALL_CAPS_NAME reference (e.g. `"password": QBIT_PASS`),
  # or `os.environ["X"]` itself (e.g. `QBIT_PASS = os.environ["QBIT_PASS"]` --
  # the rule's capture stops at the opening quote, so it grabs the literal
  # text "os.environ[" as if THAT were the secret). Neither is a real secret.
  '''^[A-Z_][A-Z0-9_]{2,40}$''',
  '''^os\.environ$''',
  # Bash `${VAR:-default}` parameter expansion (e.g.
  # `${RESTIC_PASSWORD_FILE:-/home/bjtn/.restic-password}`): the rule's
  # delimiter matches the `:` in `:-` instead of a real assignment, so the
  # capture starts right after it -- always a literal `-` followed by the
  # default value, never an actual secret.
  '''^-\S+$''',
]
paths = [
  # Records already-accepted findings (e.g. old redaction placeholders);
  # it verbatim contains match text by design, not a live secret.
  '''\.gitleaks-baseline\.json$''',
  # By convention these hold empty placeholders only (see .gitignore) --
  # real values live in sibling .env files, which are never tracked.
  '''\.env\.example$''',
]
