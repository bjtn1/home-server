# S.M.A.R.T. disk health monitoring/alerting with a web dashboard.
# https://github.com/AnalogJ/scrutiny
#
# NOT using lscr.io/linuxserver/scrutiny -- that all-in-one image panics
# on startup ("failed to check influxdb setup status") because it never
# actually configures the InfluxDB connection it needs; it's a known,
# unresolved bug (linuxserver/docker-scrutiny#24, repo now archived).
# Using upstream's official hub/spoke compose instead: separate influxdb
# + web + collector containers.
#
# Devices: mapped by /dev/disk/by-id/ (USB vendor+model+serial), NOT
# by kernel-assigned /dev/sdX letter -- those letters reshuffle any
# time a drive drops out or reconnects late (confirmed the hard way,
# see [[media-drive-incident]] incident #3: one drive going missing
# shifted the rest from sda-sdf down to sda-sde, and the old hardcoded
# /dev/sdf entry here broke the whole container even though 5 of the
# 6 drives were perfectly healthy). Each entry maps its stable by-id
# host path to a fixed container-internal /dev/sdX name so the
# collector's own smartctl scan still finds a normal-looking device
# list inside the container regardless of what the host currently
# calls it. If a drive is genuinely disconnected, its by-id symlink
# won't exist either and this container will still fail to start --
# that's correct/wanted (better to notice a monitored drive is gone
# than silently scan 5 of 6), just update the affected line rather
# than the whole list if a drive is replaced.
#
# Deliberately NOT including /dev/mmcblk0 (the Pi's boot SD card): no
# reason to grant a monitoring container write access to live boot
# media, and SD/eMMC doesn't expose standard SMART data anyway.
services:
  scrutiny-influxdb:
    image: influxdb:2.8
    container_name: scrutiny-influxdb
    restart: unless-stopped
    volumes:
      - ./influxdb:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - bjtn-proxy

  scrutiny-web:
    image: ghcr.io/analogj/scrutiny:latest-web
    container_name: scrutiny-web
    restart: unless-stopped
    volumes:
      - ./config:/opt/scrutiny/config
    environment:
      - SCRUTINY_WEB_INFLUXDB_HOST=scrutiny-influxdb
    depends_on:
      scrutiny-influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - bjtn-proxy

  scrutiny-collector:
    image: ghcr.io/analogj/scrutiny:latest-collector
    container_name: scrutiny-collector
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
    volumes:
      - /run/udev:/run/udev:ro
      - ./config:/opt/scrutiny/config
    environment:
      - COLLECTOR_API_ENDPOINT=http://scrutiny-web:8080
      - COLLECTOR_HOST_ID=bjtnpi
      - COLLECTOR_RUN_STARTUP=true
    devices:
      - source: /dev/disk/by-id/usb-Micron_CT4000X9SSD9_2535EA97271A-0:0
        target: /dev/sda
        permissions: rwm
      - source: /dev/disk/by-id/usb-Samsung_PSSD_T7_S6XBNS0W524023N-0:0
        target: /dev/sdb
        permissions: rwm
      - source: /dev/disk/by-id/usb-Samsung_PSSD_T7_Shield_S6NRNJ0WB14459D-0:0
        target: /dev/sdc
        permissions: rwm
      - source: /dev/disk/by-id/usb-Samsung_PSSD_T7_Shield_S6SLNS0X707913K-0:0
        target: /dev/sdd
        permissions: rwm
      - source: /dev/disk/by-id/usb-Samsung_PSSD_T7_Shield_S6SMNJ0W600392A-0:0
        target: /dev/sde
        permissions: rwm
      - source: /dev/disk/by-id/usb-Samsung_PSSD_T9_S744NL0Y809472T-0:0
        target: /dev/sdf
        permissions: rwm
      - source: /dev/disk/by-id/ata-ST28000NT000-4AB103_K1S1NP4L
        target: /dev/sdg
        permissions: rwm
    depends_on:
      scrutiny-web:
        condition: service_healthy
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
