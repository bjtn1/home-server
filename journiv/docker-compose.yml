# Self-hosted private journaling app. https://github.com/journiv/journiv-app
#
# Using the single-container SQLite deployment (vs. their Postgres+Redis+Celery
# "production" compose) since this is single-user -- plenty for a home server.
services:
  journiv:
    image: swalabtech/journiv-app:latest
    container_name: journiv
    restart: unless-stopped
    environment:
      - SECRET_KEY=${JOURNIV_SECRET_KEY}
      - DOMAIN_NAME=journiv.bjtn.xyz
      # DOMAIN_NAME alone only trusts one hostname (Django ALLOWED_HOSTS-style
      # check) -- journal.bjtn.xyz is a second alias for this same app, so it
      # needs to be added via CORS_ORIGINS or it 400s with "Invalid host header".
      - ENABLE_CORS=true
      - CORS_ORIGINS=https://journiv.bjtn.xyz,https://journal.bjtn.xyz
      - CORS_CREDENTIALS=true
    volumes:
      - ./data:/data
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
