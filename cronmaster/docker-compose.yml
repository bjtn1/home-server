# Cron job management UI with human-readable syntax and live logging.
# https://github.com/fccview/cronmaster
#
# CAUTION: this needs privileged + pid: host + the docker socket to edit the
# host's crontab and manage containers -- it can effectively do anything the
# host's root user can. Only expose it behind auth you trust (AUTH_PASSWORD
# below, or set up OIDC per their docs).
services:
  cronmaster:
    image: ghcr.io/fccview/cronmaster:latest
    container_name: cronmaster
    user: root
    restart: unless-stopped
    pid: host
    privileged: true
    init: true
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - HOST_CRONTAB_USER=root
      - AUTH_PASSWORD=${CRONMASTER_AUTH_PASSWORD}
      # Without this it guesses its own origin as https://cronmaster:3000 --
      # https on the container's plain-HTTP port -- and its server-side
      # session check fetch fails with ERR_SSL_WRONG_VERSION_NUMBER.
      - APP_URL=https://cronmaster.bjtn.xyz
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./snippets:/app/snippets
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
