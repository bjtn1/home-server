version: 1
host:
  id: ""

# /dev/sdc (Crucial X9, USB-NVMe bridge 0x0634:0x5606) isn't in
# smartmontools' known-bridge database, so `smartctl --scan` silently
# skips it entirely -- it never even shows up as "unknown", it's just
# absent. Forcing the type here works: confirmed manually with
# `smartctl --info -d sntasmedia /dev/sdc` (exit 0, correct model).
devices:
  - device: /dev/sdc
    type: 'sntasmedia'
  # /dev/sdf (Samsung T9) hit the same `smartctl --scan` silent-skip
  # issue as sdc above, discovered 2026-08-25 when adding the 28TB
  # drive -- confirmed via `smartctl --info -d sntasmedia /dev/sdf`
  # (exit 0, correct model/serial), --scan just never lists it.
  - device: /dev/sdf
    type: 'sntasmedia'
  # /dev/sdh (12TB games drive, ST12000VN0008-3MH101) added 2026-08-27 --
  # collector auto-detect guesses NVMe first and fails ("Read NVMe
  # Identify Controller failed"), same class of bridge-detection miss as
  # sdc/sdf above but the opposite direction (needs 'sat', not
  # 'sntasmedia'). Confirmed via `smartctl --info -d sat /dev/sdh`
  # (exit 0, correct model/serial).
  - device: /dev/sdh
    type: 'sat'
