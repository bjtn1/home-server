# Uptime monitoring/status dashboard w/ alerting. https://github.com/louislam/uptime-kuma
#
# NOTE: this only catches individual services going down while the Pi itself
# stays up -- it can't alert on the whole box/network going offline, since
# it dies right along with everything else in that case. For that you'd
# need an external checker outside this network. Also needs a real
# notification channel configured (Discord/ntfy/email/etc.) in its own UI
# to actually be useful -- a dashboard nobody's watching doesn't help.
services:
  kuma:
    image: louislam/uptime-kuma:1
    container_name: kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    # every *.bjtn.xyz domain resolves publicly to a Tailscale (100.x)
    # address -- fine for real clients, but this container isn't a tailnet
    # member and just hangs until timeout trying to reach it. Docker
    # network aliases don't work here (embedded DNS only intercepts
    # single-label names, not dotted FQDNs), so /etc/hosts entries
    # pointing straight at caddy's pinned IP instead.
    extra_hosts:
      - "arcane.bjtn.xyz:172.20.0.2"
      - "bazarr.bjtn.xyz:172.20.0.2"
      - "beszel.bjtn.xyz:172.20.0.2"
      - "cleanuparr.bjtn.xyz:172.20.0.2"
      - "books.bjtn.xyz:172.20.0.2"
      - "dozzle.bjtn.xyz:172.20.0.2"
      - "grimmory.bjtn.xyz:172.20.0.2"
      - "homarr.bjtn.xyz:172.20.0.2"
      - "home.bjtn.xyz:172.20.0.2"
      - "immich.bjtn.xyz:172.20.0.2"
      - "jellyfin.bjtn.xyz:172.20.0.2"
      - "journal.bjtn.xyz:172.20.0.2"
      - "journiv.bjtn.xyz:172.20.0.2"
      - "kuma.bjtn.xyz:172.20.0.2"
      - "library.bjtn.xyz:172.20.0.2"
      - "logs.bjtn.xyz:172.20.0.2"
      - "notes.bjtn.xyz:172.20.0.2"
      - "nzb.bjtn.xyz:172.20.0.2"
      - "photos.bjtn.xyz:172.20.0.2"
      - "pi.bjtn.xyz:172.20.0.2"
      - "pihole.bjtn.xyz:172.20.0.2"
      - "pi-sync.bjtn.xyz:172.20.0.2"
      - "portainer.bjtn.xyz:172.20.0.2"
      - "prowlarr.bjtn.xyz:172.20.0.2"
      - "qbit.bjtn.xyz:172.20.0.2"
      - "radarr.bjtn.xyz:172.20.0.2"
      - "romm.bjtn.xyz:172.20.0.2"
      - "roms.bjtn.xyz:172.20.0.2"
      - "scrutiny.bjtn.xyz:172.20.0.2"
      - "seerr.bjtn.xyz:172.20.0.2"
      - "shelfmark.bjtn.xyz:172.20.0.2"
      - "sonarr.bjtn.xyz:172.20.0.2"
      - "urls.bjtn.xyz:172.20.0.2"
      - "youtarr.bjtn.xyz:172.20.0.2"
      - "yourls.bjtn.xyz:172.20.0.2"
    networks:
      - bjtn-proxy

