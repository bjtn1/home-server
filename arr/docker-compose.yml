services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${wireguard_private_key}
      - TZ=America/New_York
      - WIREGUARD_KERNEL_MODULE=false
    volumes:
      - ./gluetun/auth/config.toml:/gluetun/auth/config.toml:ro
    ports:
      #- 8181:8181
      - 6881:6881
      - 6881:6881/udp
      - 8001:8000
    labels:
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped
    networks:
      - bjtn-proxy

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8181
    volumes:
      - ./qbittorrent/config:/config
      - ${downloads}:/downloads
      - ${tv}:/mnt/media/tv
      - ${movies}:/mnt/media/movies
      - ${books}:/mnt/media/books
      - ${downloads}:/mnt/media/downloads
      - ${youtube}:/mnt/media/youtube
      - ${music_sheets}:/mnt/media/music-sheets
      - ${emu}:/mnt/emu
      - ${games}:/mnt/games
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./sabnzbd/config:/config
      - ${downloads}:/downloads
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    #ports:
      #- 8191:8191
    restart: unless-stopped
    networks:
        - bjtn-proxy

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./prowlarr/config:/config
    #ports:
      #- 9696:9696
    restart: unless-stopped
    networks:
        - bjtn-proxy

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./sonarr/config:/config
      - ${tv}:/tv
      - ${downloads}:/downloads
    #ports:
      #- 8989:8989
    restart: unless-stopped
    networks:
        - bjtn-proxy

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./radarr/config:/config
      - ${movies}:/movies
      - ${movies_archive}:/movies-archive
      - ${downloads}:/downloads
    #ports:
      #- 7878:7878
    restart: unless-stopped
    networks:
        - bjtn-proxy

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - TZ=America/New_York
    # VAAPI hardware transcode passthrough (ThinkPad's UHD 620, Gen9.5) --
    # still needs "Hardware acceleration: Intel QuickSync (VAAPI)" enabled
    # manually in Jellyfin admin UI (Dashboard -> Playback) after startup.
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ${tv}:/media/tv:ro
      - ${movies}:/media/movies:ro
      - ${books}:/media/books:ro
      - ${downloads}:/media/downloads:ro
      - ${youtube}:/media/youtube:ro
      - ${music_sheets}:/media/music-sheets:ro
      - ${obs}:/obs:ro
    #ports:
      #- 8096:8096
    restart: unless-stopped
    networks:
        - bjtn-proxy

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./bazarr/config:/config
      - ${movies}:/movies
      - ${tv}:/tv
    #ports:
      #- 6767:6767
    restart: unless-stopped
    networks:
        - bjtn-proxy

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - TZ=America/New_York
    volumes:
      - ./jellyseerr/config:/app/config
    restart: unless-stopped
    networks:
        - bjtn-proxy

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    environment:
      PUID: 1000
      PGID: 1000
    #ports:
      #- 8084:8084
    restart: unless-stopped
    volumes:
      - ${books}:/books # Default destination for book downloads
      - ./shelfmark/config:/config # App configuration
      # Required for torrent / usenet - path must match your download client's volume exactly
      # - /path/to/downloads:/path/to/downloads
    networks:
      - bjtn-proxy

  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    user: 1000:1000
    environment:
      - TZ=America/New_York
      # Sonarr/Radarr integration -- extracts archives from completed
      # downloads in their queues, matching how they see /downloads.
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${sonarr_api_key}
      - UN_SONARR_0_PATHS_0=/downloads
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${radarr_api_key}
      - UN_RADARR_0_PATHS_0=/downloads
      # Standalone folder-watch -- extracts anything jDownloader drops in
      # its dedicated downloads subfolder, independent of the *arr queues.
      - UN_FOLDER_0_PATH=/downloads/jdownloader
    volumes:
      - ${downloads}:/downloads
    restart: unless-stopped
    networks:
      - bjtn-proxy

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./cleanuparr/config:/config
    networks:
      - bjtn-proxy

  # Self-hosted ROM manager + browser player (EmulatorJS). https://github.com/rommapp/romm
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=${ROMM_DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER}
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASSWORD}
      - RETROACHIEVEMENTS_API_KEY=${RETROACHIEVEMENTS_API_KEY}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY}
      - HASHEOUS_API_ENABLED=true
      - PLAYMATCH_API_ENABLED=true
      - HLTB_API_ENABLED=true
      - SCAN_WORKERS=2
      - WEB_SERVER_CONCURRENCY=3
    volumes:
      - ./romm/resources:/romm/resources
      - ./romm/redis-data:/redis-data
      - ${ROMM_LIBRARY_PATH}:/romm/library
      - ./romm/assets:/romm/assets
      - ./romm/config:/romm/config
    networks:
      - bjtn-proxy

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${ROMM_DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=${ROMM_DB_PASSWORD}
    volumes:
      - ./romm/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bjtn-proxy

  # YouTube playlist downloader. No functional coupling to the rest of the
  # arr stack (own DB, no shared secrets/network deps) -- merged in purely
  # for directory tidiness, same as romm still is (questarr and romarr got
  # the same treatment too, but were later removed entirely -- didn't work out).
  youtarr-db:
    image: mariadb:10.3
    container_name: youtarr-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${YOUTARR_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: youtarr
      MYSQL_TCP_PORT: 3321
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - youtarr-db-data:/var/lib/mysql
    command: --port=3321 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-file-per-table=1 --innodb-large-prefix=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-P", "3321", "-u", "root", "-p${YOUTARR_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bjtn-proxy

  youtarr:
    image: dialmaster/youtarr:latest
    container_name: youtarr
    restart: unless-stopped
    user: "${YOUTARR_UID}:${YOUTARR_GID}"
    depends_on:
      youtarr-db:
        condition: service_healthy
    environment:
      - TZ=America/New_York
      - DB_HOST=youtarr-db
      - DB_PORT=3321
      - DB_USER=root
      - DB_PASSWORD=${YOUTARR_DB_ROOT_PASSWORD}
      - DB_NAME=youtarr
      - LOG_LEVEL=info
      - YOUTUBE_OUTPUT_DIR=${YOUTUBE_OUTPUT_DIR}
    volumes:
      - ${YOUTUBE_OUTPUT_DIR}:/usr/src/app/data
      - ./youtarr/server/images:/app/server/images
      - ./youtarr/config:/app/config
      - ./youtarr/jobs:/app/jobs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:3011/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true

volumes:
  youtarr-db-data:
    # pinned to the exact pre-existing volume name -- without this, Compose
    # would prefix it with this project's name ("arr") and create a brand
    # new EMPTY volume instead of reusing the real one with actual data.
    name: youtarr_youtarr-db-data
    external: true
