# JDownloader2 -- link-decrypting/one-click-hoster download manager with a
# real per-file/per-package destination folder (unlike pyload). Web-based
# noVNC GUI, so you interact with the actual JDownloader desktop app in a
# browser. https://github.com/jlesage/docker-jdownloader-2
services:
  jdownloader2:
    image: jlesage/jdownloader-2
    container_name: jdownloader2
    restart: unless-stopped
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=America/New_York
      - MYJDOWNLOADER_EMAIL=${MYJDOWNLOADER_EMAIL}
      - MYJDOWNLOADER_PASSWORD=${MYJDOWNLOADER_PASSWORD}
      - MYJDOWNLOADER_DEVICE_NAME=${MYJDOWNLOADER_DEVICE_NAME}
    volumes:
      - ./config:/config
      - ${JDOWNLOADER_DOWNLOADS_PATH}:/output
      - ${JDOWNLOADER_TV_PATH}:/mnt/media/tv
      - ${JDOWNLOADER_MOVIES_PATH}:/mnt/media/movies
      - ${JDOWNLOADER_BOOKS_PATH}:/mnt/media/books
      - ${JDOWNLOADER_YOUTUBE_PATH}:/mnt/media/youtube
      - ${JDOWNLOADER_MUSIC_SHEETS_PATH}:/mnt/media/music-sheets
      - ${JDOWNLOADER_OBS_PATH}:/mnt/obs
      - ${JDOWNLOADER_EMU_PATH}:/mnt/emu
      - ${JDOWNLOADER_GAMES_PATH}:/mnt/games
    #ports:
      #- 5800:5800 # web GUI
      #- 5900:5900 # raw VNC, optional
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
