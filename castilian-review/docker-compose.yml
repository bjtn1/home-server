services:
  castilian-review:
    build: .
    container_name: castilian-review
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    volumes:
      - ../scripts:/scripts:ro
      - /mnt/vault:/mnt/vault
    networks:
      - bjtn-proxy

networks:
  bjtn-proxy:
    external: true
